function readStored(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; } }
function writeStored(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
function flattenAllCompleted(progress) { return Object.values(progress || {}).reduce((n, x) => n + ((x && x.completed) || []).length, 0); }
function learningXP(progress) { return flattenAllCompleted(progress) * 10 + Object.values(progress || {}).reduce((n, x) => n + Object.keys((x && x.quizScores) || {}).length * 25, 0); }
function activeStreak(activity) {
  const dates = new Set((activity || []).map(x => x.slice(0, 10)));
  let streak = 0, d = new Date();
  while (dates.has(d.toISOString().slice(0,10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function logActivity(activity, setActivity) {
  const today = new Date().toISOString().slice(0,10);
  if ((activity || []).includes(today)) return;
  const next = [...(activity || []), today].slice(-60);
  setActivity(next); writeStored(ML_STORAGE.activity, next);
}

/* Robust course navigation helpers */
function findItem(courseId, itemId) {
  const course = COURSES.find((c) => c.id === courseId);
  if (!course || !itemId) return { course: null, module: null, item: null };
  for (const module of (course.modules || [])) {
    const item = (module.items || []).find((it) => it.id === itemId);
    if (item) return { course, module, item };
  }
  return { course, module: null, item: null };
}
function flatSequence(course) {
  return course ? (course.modules || []).flatMap((module) => module.items || []) : [];
}

function AuthModal({ open, mode, setMode, onClose, onAuth }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (!open) return;
    setEmail("");
    setPassword("");
    setName("");
    setError("");
    setLoading(false);
  }, [open, mode]);

  if (!open) return null;

  const isSignup = mode === "signup";

  const submitAuth = async (e) => {
    e.preventDefault();
    setError("");

    const cleanEmail = email.trim().toLowerCase();
    const cleanName = name.trim();

    if (!/^\S+@\S+\.\S+$/.test(cleanEmail)) {
      setError("Geli email sax ah, tusaale: magaca@example.com.");
      return;
    }
    if (password.length < 6) {
      setError("Password-ku waa inuu ahaadaa ugu yaraan 6 xaraf.");
      return;
    }
    if (isSignup && cleanName.length < 2) {
      setError("Fadlan geli magacaaga oo buuxa.");
      return;
    }

    if (!window.firebase || !firebase.auth) {
      setError("Firebase Authentication lama diyaar ah.");
      return;
    }

    setLoading(true);
    try {
      let result;
      if (isSignup) {
        result = await firebase.auth().createUserWithEmailAndPassword(cleanEmail, password);
        if (result.user && cleanName) {
          await result.user.updateProfile({ displayName: cleanName });
        }
      } else {
        result = await firebase.auth().signInWithEmailAndPassword(cleanEmail, password);
      }
      onAuth(result.user);
    } catch (err) {
      console.error("Email authentication error:", err);
      const code = err && err.code ? err.code : "";
      const messages = {
        "auth/email-already-in-use": "Email-kan hore ayaa akoon loogu sameeyay. Fadlan Gal.",
        "auth/invalid-email": "Email-ka aad gelisay sax ma aha.",
        "auth/weak-password": "Password-ku waa daciif. Isticmaal ugu yaraan 6 xaraf.",
        "auth/invalid-credential": "Email ama password-ka waa khalad.",
        "auth/user-not-found": "Akoon email-kan leh lama helin.",
        "auth/wrong-password": "Password-ka waa khalad.",
        "auth/too-many-requests": "Isku dayo badan ayaa dhacay. Fadlan wax yar sug kadib isku day mar kale.",
        "auth/network-request-failed": "Internet-ka hubi kadib isku day mar kale.",
        "auth/operation-not-allowed": "Email/Password Authentication weli Firebase kama shidna.",
      };
      setError(messages[code] || (err && err.message ? err.message : "Akoonka lama geli karin. Fadlan isku day mar kale."));
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center px-4 bg-black/75 backdrop-blur-sm" onClick={() => { if (onClose) onClose(); }}>
      <div onClick={(e) => e.stopPropagation()} className="w-full max-w-md rounded-3xl border border-[#273449] bg-[#111827] p-6 sm:p-7 shadow-2xl">
        <div className="flex items-start justify-between gap-4">
          <div>
            <Badge tone="blue">MaanLearn</Badge>
            <h2 className="font-display font-bold text-2xl text-[#F8FAFC] mt-3">
              {isSignup ? "Samee akoon" : "Gal akoonkaaga"}
            </h2>
            <p className="font-body text-sm text-[#94A3B8] mt-1">
              {isSignup ? "Samee akoon MaanLearn ah si aad u bilowdo barashada." : "Geli email-kaaga iyo password-kaaga si aad u sii wadato MaanLearn."}
            </p>
          </div>
          {onClose && <button onClick={onClose} className="w-9 h-9 rounded-full flex items-center justify-center text-[#94A3B8] hover:bg-white/10"><X size={18} /></button>}
        </div>

        <form onSubmit={submitAuth} className="mt-6 space-y-4">
          {isSignup && (
            <Field label="Magaca oo buuxa" type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="Magacaaga" autoComplete="name" />
          )}
          <Field label="Email" type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="magaca@example.com" autoComplete="email" inputMode="email" />
          <Field label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Ugu yaraan 6 xaraf" autoComplete={isSignup ? "new-password" : "current-password"} minLength={6} />
          {error && <p className="text-sm text-[#F87171] leading-relaxed">{error}</p>}
          <Button type="submit" className="w-full" disabled={loading}>
            {loading ? (isSignup ? "Samaynaya..." : "Galaya...") : (isSignup ? "Samee akoon" : "Gal")}
          </Button>
        </form>

        <div className="mt-5 text-center">
          <button
            type="button"
            className="text-sm font-semibold text-[#22D3EE] hover:underline"
            onClick={() => { setError(""); setMode(isSignup ? "login" : "signup"); }}
          >
            {isSignup ? "Hore akoon ma u leedahay? Gal" : "Akoon ma lihid? Samee akoon"}
          </button>
        </div>
      </div>
    </div>
  );
}

function CodePracticePage() {
  const [language, setLanguage] = useState("javascript");
  const samples = {
    python: 'print("Hello, MaanLearn!")',
    javascript: 'console.log("Hello, MaanLearn!");',
    html: '<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello, MaanLearn!</h1>\n</body>\n</html>'
  };
  const [code, setCode] = useState(samples.javascript);
  const [output, setOutput] = useState("");
  const [htmlPreview, setHtmlPreview] = useState("");
  const [running, setRunning] = useState(false);
  const [pythonReady, setPythonReady] = useState(false);

  const changeLanguage = (next) => {
    setLanguage(next);
    setCode(samples[next]);
    setOutput("");
    setHtmlPreview("");
    if (next !== "python") setPythonReady(false);
  };

  const clearCode = () => {
    setCode("");
    setOutput("");
    setHtmlPreview("");
  };

  const loadPython = async () => {
    if (window.__maanlearnPyodide) {
      setPythonReady(true);
      return window.__maanlearnPyodide;
    }
    if (typeof window.loadPyodide !== "function") {
      throw new Error("Python engine is not available. Refresh the page and make sure the internet connection is working.");
    }
    if (!window.__maanlearnPyodidePromise) {
      window.__maanlearnPyodidePromise = window.loadPyodide({
        indexURL: "https://cdn.jsdelivr.net/pyodide/v314.0.7/full/"
      }).then(py => {
        window.__maanlearnPyodide = py;
        return py;
      }).catch(err => {
        window.__maanlearnPyodidePromise = null;
        throw err;
      });
    }
    const py = await window.__maanlearnPyodidePromise;
    setPythonReady(true);
    return py;
  };

  const runJavaScript = () => new Promise((resolve) => {
    const frame = document.createElement("iframe");
    frame.setAttribute("sandbox", "allow-scripts");
    frame.setAttribute("title", "JavaScript execution sandbox");
    frame.style.position = "fixed";
    frame.style.width = "1px";
    frame.style.height = "1px";
    frame.style.left = "-10000px";
    frame.style.top = "-10000px";
    frame.style.border = "0";
    const token = "ML_JS_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    const safeCode = code.replace(/<\/script/gi, "<\\/script");
    let settled = false;
    let timer = null;
    const finish = (result) => {
      if (settled) return;
      settled = true;
      window.removeEventListener("message", listener);
      clearTimeout(timer);
      frame.remove();
      resolve(result);
    };
    const listener = (event) => {
      const data = event.data;
      if (!data || data.token !== token) return;
      finish({
        error: data.error || "",
        logs: Array.isArray(data.logs) ? data.logs : []
      });
    };
    window.addEventListener("message", listener);
    const payload = `
      ${"<"}script>
      (() => {
        const token = ${JSON.stringify(token)};
        const logs = [];
        const stringify = value => {
          try { return typeof value === "string" ? value : JSON.stringify(value); }
          catch (_) { return String(value); }
        };
        const send = error => parent.postMessage({ token, logs, error: error || "" }, "*");
        console.log = (...args) => logs.push(args.map(stringify).join(" "));
        console.info = (...args) => logs.push(args.map(stringify).join(" "));
        console.warn = (...args) => logs.push("Warning: " + args.map(stringify).join(" "));
        console.error = (...args) => logs.push("Error: " + args.map(stringify).join(" "));
        window.onerror = (message) => { send(String(message)); };
        try {
          ${safeCode}
          send("");
        } catch (error) {
          send(error && error.stack ? error.stack : String(error));
        }
      })();
      <\/script>`;
    frame.srcdoc = payload;
    document.body.appendChild(frame);
    timer = setTimeout(() => finish({error: "JavaScript execution timed out after 5 seconds.", logs: []}), 5000);
  });

  const run = async () => {
    if (!code.trim()) {
      setOutput("Nothing to run. Write some code first.");
      return;
    }
    setRunning(true);
    setOutput("");
    try {
      if (language === "html") {
        setHtmlPreview(code);
        setOutput("HTML preview updated successfully.");
        return;
      }
      if (language === "python") {
        setOutput("Loading Python engine… first run may take a little while.");
        const py = await loadPython();
        const captured = [];
        py.setStdout({ batched: msg => captured.push(String(msg)) });
        py.setStderr({ batched: msg => captured.push("Error: " + String(msg)) });
        await py.runPythonAsync(code);
        setOutput(captured.join("\n") || "Code ran successfully (no output).");
        return;
      }
      const result = await runJavaScript();
      if (result.error) setOutput("Error: " + result.error);
      else setOutput(result.logs.join("\n") || "Code ran successfully (no console output).");
    } catch (e) {
      setOutput("Error: " + (e && e.message ? e.message : String(e)));
    } finally {
      setRunning(false);
    }
  };

  return <main className="bg-[#F8FAFC] text-[#0F172A] min-h-[70vh] px-5 md:px-8 py-12">
    <div className="max-w-5xl mx-auto">
      <p className="text-sm font-semibold text-[#1557B0]">Code Practice</p>
      <h1 className="font-display font-bold text-4xl mt-2">💻 Code Practice</h1>
      <p className="text-[#64748B] mt-3">Write, edit, clear and run Python, JavaScript or HTML code in the browser.</p>
      <div className="mt-8 rounded-2xl border border-[#E2E8F0] bg-white overflow-hidden shadow-sm">
        <div className="px-4 py-3 border-b flex flex-wrap gap-3 items-center justify-between">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-semibold">Language:</span>
            {["python","javascript","html"].map(lang => <button type="button" key={lang} onClick={()=>changeLanguage(lang)} className={`px-3 py-1.5 rounded-lg text-sm font-semibold ${language===lang ? "bg-[#1557B0] text-white" : "bg-[#F1F5F9] text-[#475569]"}`}>{lang === "javascript" ? "JavaScript" : lang.toUpperCase()}</button>)}
          </div>
          <div className="flex gap-2">
            <button type="button" onClick={clearCode} className="px-3 py-2 text-sm border rounded-lg">Clear</button>
            <button type="button" onClick={run} disabled={running} className="px-4 py-2 text-sm rounded-lg bg-[#1557B0] text-white disabled:opacity-60">{running ? "Running…" : "▶ Run Code"}</button>
          </div>
        </div>
        <div className="bg-[#0B1220] px-4 py-2 text-xs text-[#94A3B8] font-mono flex items-center justify-between">
          <span>editor.{language === "javascript" ? "js" : language}</span>
          {language === "python" && <span>{pythonReady ? "Python ready" : "Python loads on first run"}</span>}
        </div>
        <textarea value={code} onChange={e=>setCode(e.target.value)} spellCheck="false" aria-label="Code editor" className="w-full min-h-[300px] p-5 font-mono text-sm leading-6 bg-[#0F172A] text-[#E2E8F0] outline-none resize-y" />

    </div>

function courseProgress(course, progress) {
  const allItems = course.modules.flatMap((m) => m.items);
  if (allItems.length === 0) return 0;
  const done = allItems.filter((it) => progress[course.id]?.completed?.includes(it.id)).length;
  return Math.round((done / allItems.length) * 100);
}

   ROOT APP
--------------------------------------------------------- */
function App() {
  useEffect(() => {  }, []);
  const [view, setView] = useState("home");
  const [params, setParams] = useState({});
  const [firebaseUser, setFirebaseUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [authOpen, setAuthOpen] = useState(false);
  const [authMode, setAuthMode] = useState("signup");
  const [user, setUser] = useState(null);

  useEffect(() => {
    if (!window.firebase || !firebase.auth) {
      setAuthReady(true);
      return;
    }
    const unsubscribe = firebase.auth().onAuthStateChanged((fbUser) => {
      setFirebaseUser(fbUser);
      if (fbUser) {
        setUser({ uid: fbUser.uid, name: fbUser.displayName || "Arday", phone: fbUser.phoneNumber || "", email: fbUser.email || "", role: "student" });
        setAuthOpen(false);
      } else {
        setUser(null);
        setAuthOpen(true);
      }
      setAuthReady(true);
    });
    return () => unsubscribe();
  }, []);
  const [enrollments, setEnrollments] = useState(() => readStored(ML_STORAGE.enrollments, []));
  const [progress, setProgress] = useState(() => readStored(ML_STORAGE.progress, {})); // { courseId: { completed: [], quizScores: {} } }
  const [certificates, setCertificates] = useState(() => readStored(ML_STORAGE.certificates, []));
  const [bookmarks, setBookmarks] = useState(() => readStored(ML_STORAGE.bookmarks, []));
  const [activity, setActivity] = useState(() => readStored(ML_STORAGE.activity, []));
  const [localCourses, setLocalCourses] = useState(COURSES);
  const [dark, setDark] = useState(true);
  const toggleDark = () => setDark((d) => !d);
  useEffect(()=>writeStored(ML_STORAGE.enrollments,enrollments),[enrollments]);
  useEffect(()=>writeStored(ML_STORAGE.progress,progress),[progress]);
  useEffect(()=>writeStored(ML_STORAGE.certificates,certificates),[certificates]);
  useEffect(()=>writeStored(ML_STORAGE.bookmarks,bookmarks),[bookmarks]);
  useEffect(()=>writeStored(ML_STORAGE.activity,activity),[activity]);
  const toggleBookmark = (itemId) => setBookmarks(b => b.includes(itemId) ? b.filter(x=>x!==itemId) : [...b,itemId]);

  const COURSE_VIEWS = new Set(["courses", "course-detail", "lesson", "practice-item", "quiz", "progress", "certificate"]);
  const [isOnline, setIsOnline] = useState(() => navigator.onLine);
  useEffect(() => {
    const onOnline = () => setIsOnline(true);
    const onOffline = () => setIsOnline(false);
    window.addEventListener("online", onOnline);
    window.addEventListener("offline", onOffline);
    return () => {
      window.removeEventListener("online", onOnline);
      window.removeEventListener("offline", onOffline);
    };
  }, []);

  const go = (v, p = {}) => {
    if (!navigator.onLine && COURSE_VIEWS.has(v)) {
      window.alert("Internet ayaa loo baahan yahay si loo isticmaalo koorsooyinka MaanLearn. Fadlan internet-ka shid.");
      return;
    }
    setView(v); setParams(p); window.scrollTo(0, 0);
  };

  const enroll = (courseId) => {
    if (!enrollments.includes(courseId)) setEnrollments([...enrollments, courseId]);
    logActivity(activity, setActivity);
    setProgress((p) => ({ ...p, [courseId]: p[courseId] || { completed: [], quizScores: {} } }));
    go("course-detail", { courseId });
  };

  const complete = (courseId, itemId) => {
    logActivity(activity, setActivity);
    setProgress((p) => {
      const cur = p[courseId] || { completed: [], quizScores: {} };
      if (cur.completed.includes(itemId)) return p;
      const updated = { ...cur, completed: [...cur.completed, itemId] };
      const course = localCourses.find((c) => c.id === courseId);
      const allItems = course && Array.isArray(course.modules)
        ? course.modules.flatMap((m) => Array.isArray(m.items) ? m.items : [])
        : [];
      const allDone = allItems.length > 0 && allItems.every((it) => updated.completed.includes(it.id));
      if (allDone && !certificates.find((c) => c.courseId === courseId)) {
        setCertificates((cs) => [...cs, {
          courseId,
          id: `BC-${courseId.toUpperCase()}-${Math.floor(1000 + Math.random() * 9000)}`,
          date: new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }),
        }]);
      }
      return { ...p, [courseId]: updated };
    });
  };

  const recordQuiz = (courseId, quizId, score) => {
    setProgress((p) => {
      const cur = p[courseId] || { completed: [], quizScores: {} };
      return { ...p, [courseId]: { ...cur, quizScores: { ...cur.quizScores, [quizId]: score } } };
    });
  };

  const publicViews = ["courses", "code-practice", "contact", "paths", "challenges"];
  const studentViews = ["dashboard", "course-detail", "lesson", "practice-item", "quiz", "progress", "certificate"];
  const adminViews = ["admin", "admin-courses", "admin-students"];

  let content;
  if (!isOnline && COURSE_VIEWS.has(view)) {
    content = (
      <div className="min-h-screen bg-[#0B1120] text-[#F8FAFC] flex items-center justify-center px-6">
        <div className="max-w-md w-full text-center rounded-2xl bg-[#111827] border border-[#273449] p-8 shadow-xl">
          <div className="mx-auto w-14 h-14 rounded-full bg-[#F59E0B]/10 flex items-center justify-center text-2xl">🌐</div>
          <h1 className="font-display font-bold text-2xl mt-5">Internet ayaa loo baahan yahay</h1>
          <p className="text-[#94A3B8] mt-3 leading-relaxed">MaanLearn courses-ka waxaa loogu talagalay inay shaqeeyaan marka internet-ku jiro. Shid internet-ka kadibna isku day mar kale.</p>
          <Button className="mt-6" onClick={() => { if (navigator.onLine) { setIsOnline(true); setView("courses"); } else window.alert("Weli internet ma jiro."); }}>Mar kale isku day</Button>
          <button className="block mx-auto mt-4 text-sm text-[#94A3B8] hover:text-white" onClick={() => { setView("home"); setParams({}); }}>Ku noqo Home</button>
        </div>
      </div>
    );
  } else if (view === "home") content = <HomePage go={go} user={user} setUser={setUser} view={view} />;
  else if (publicViews.includes(view)) {
    if (view === "courses") content = <PublicPageShell go={go} user={user} view={view}><CoursesPage go={go} enrollments={enrollments} initialQuery={params.query || ""} localCourses={localCourses} /></PublicPageShell>;
    
    else if (view === "code-practice") content = <PublicPageShell go={go} user={user} view={view} light><CodePracticePage /></PublicPageShell>;
    else if (view === "paths") content = <PublicPageShell go={go} user={user} view={view}><LearningPathsPage go={go} enrollments={enrollments} /></PublicPageShell>;
    else if (view === "challenges") content = <PublicPageShell go={go} user={user} view={view}><ChallengesPage go={go} /></PublicPageShell>;
    else if (view === "contact") content = <PublicPageShell go={go} user={user} view={view} light><ContactPage go={go} /></PublicPageShell>;
  } else if (studentViews.includes(view)) {
    let inner;
    if (view === "dashboard") inner = <DashboardPage user={user} go={go} enrollments={enrollments} progress={progress} certificates={certificates} bookmarks={bookmarks} activity={activity} />;
    else if (view === "course-detail") inner = <CourseDetailPage courseId={params.courseId} go={go} enrollments={enrollments} enroll={enroll} progress={progress} />;
    else if (view === "lesson") inner = <LessonPage courseId={params.courseId} itemId={params.itemId} go={go} complete={complete} progress={progress} bookmarks={bookmarks} toggleBookmark={toggleBookmark} />;
    else if (view === "practice-item") inner = <PracticePage courseId={params.courseId} itemId={params.itemId} go={go} complete={complete} progress={progress} />;
    else if (view === "quiz") inner = <QuizPage courseId={params.courseId} itemId={params.itemId} go={go} complete={complete} recordQuiz={recordQuiz} progress={progress} />;
    else if (view === "progress") inner = <ProgressPage enrollments={enrollments} progress={progress} certificates={certificates} go={go} user={user} />;
    else if (view === "certificate") inner = <CertificatePage courseId={params.courseId} go={go} certificates={certificates} user={user} />;
    content = <AppShell user={user} go={go} view={view}>{inner}</AppShell>;
  } else if (adminViews.includes(view)) {
    let inner;
    if (view === "admin") inner = <AdminOverview />;
    else if (view === "admin-courses") inner = <AdminCourses localCourses={localCourses} setLocalCourses={setLocalCourses} />;
    else if (view === "admin-students") inner = <AdminStudents />;
    content = <AdminShell user={user} go={go} view={view}>{inner}</AdminShell>;
  } else {
    content = <HomePage go={go} user={user} setUser={setUser} dark={dark} toggleDark={toggleDark} view={view} />;
  }

  const lightView = view === "home" || view === "projects" || view === "practice" || view === "contact";
  if (!authReady) {
    return (
      <div className="min-h-screen bg-[#F8FAFC] flex items-center justify-center text-[#475569] font-body">
        <div className="text-center"><div className="text-xl font-semibold text-[#0F172A]">MaanLearn</div><p className="mt-2 text-sm">Diyaarinaya akoonkaaga...</p></div>
      </div>
    );
  }
  if (!firebaseUser) {
    return (
      <div className="min-h-screen bg-[#F8FAFC]">
        <AuthModal open={authOpen} mode={authMode} setMode={setAuthMode} onClose={null} onAuth={(fbUser) => {
          setFirebaseUser(fbUser);
          setUser({ uid: fbUser.uid, name: fbUser.displayName || "Arday", phone: fbUser.phoneNumber || "", email: fbUser.email || "", role: "student" });
          setAuthOpen(false);
        }} />
      </div>
    );
  }
  return (
    <div className={`font-body min-h-screen relative overflow-hidden ${lightView ? "bg-[#F8FAFC] text-[#0F172A]" : "bg-[#0B1120] text-[#F8FAFC]"}`}>
      <FontLoader />
      {!lightView && <div className="absolute inset-0 bg-gradient-to-br from-[#0B1120] via-[#0F172A] to-[#0B1120] pointer-events-none" />}
      {!lightView && <div className="absolute top-[-10rem] left-[-8rem] w-[28rem] h-[28rem] rounded-full bg-[#6366F1]/10 blur-3xl -z-10 pointer-events-none" />}
      {!lightView && <div className="absolute top-1/3 right-[-10rem] w-[26rem] h-[26rem] rounded-full bg-[#22D3EE]/[0.06] blur-3xl -z-10 pointer-events-none" />}
      <div className="relative">{content}</div>
    </div>
  );
}

window.__MaanLearnApp = App;

window.addEventListener("error", (event) => {
  console.error("MaanLearn runtime error:", event.error || event.message);
});
window.addEventListener("unhandledrejection", (event) => {
  console.error("MaanLearn unhandled promise rejection:", event.reason);
});


try {
  const AppComponent = window.__MaanLearnApp;
  if (!AppComponent) throw new Error("MaanLearn App component was not created.");
  ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AppComponent));
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js", { scope: "./" })
        .catch((err) => console.warn("MaanLearn SW registration failed:", err));
    });
  }
} catch (error) {
  console.error("MaanLearn startup error:", error);
  const root = document.getElementById("root");
  root.innerHTML = '<div style="min-height:100vh;background:#F8FAFC;color:#0F172A;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;text-align:center;"><div><h1 style="font-size:28px;margin-bottom:10px;">MaanLearn</h1><p>The interactive preview could not start. Please make sure you are online and open this HTML file in a modern browser.</p><p style="font-size:12px;color:#64748B;margin-top:12px;">Check the browser console for the exact error.</p></div></div>';
}
</script>
</body>
</html>
